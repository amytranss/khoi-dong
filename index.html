<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tăng tốc – Giáo viên</title><link rel="stylesheet" href="app.css">
<style>
main{max-width:1500px;margin:auto;padding:14px 18px 40px;display:grid;gap:16px}
.bar{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;font-weight:700}
.code{background:#ffffff1c;border:2px dashed var(--y);border-radius:14px;padding:6px 16px;font-size:clamp(16px,1.8vw,26px)}.code b{color:var(--y);font-size:1.5em;letter-spacing:.15em}
.stage{display:grid;grid-template-columns:1fr auto 1fr;gap:20px;align-items:center}
.q{text-align:center;display:grid;gap:14px}.q h2{font-size:clamp(18px,2.6vw,36px)}.hint{font-size:clamp(28px,4vw,56px)}
.ctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:clamp(14px,1.6vw,22px)}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.card{position:relative;background:#ffffff14;border:3px solid #ffffff33;border-radius:18px;padding:14px;display:grid;gap:6px;text-align:center}
.card.done{border-color:var(--c);background:#19e3ff1f}.pop{animation:pop .6s}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.card.first{border-color:var(--y);background:#ffd23f26;box-shadow:0 0 34px #ffd23f99;animation:glow 1.2s infinite alternate}
@keyframes glow{to{box-shadow:0 0 12px #ffd23f55}}
.card.ok{border-color:var(--g)}.card.no{border-color:var(--r);opacity:.75}
.tn{font-weight:900;font-size:1.25em}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ff3b5c;margin-left:8px}.dot.on{background:var(--g)}
.st{font-size:.9em;opacity:.85}.ans{font-size:clamp(20px,2.2vw,32px);font-weight:900;min-height:1.3em;color:var(--y);word-break:break-word}
.meta{display:flex;justify-content:center;gap:12px;align-items:center;font-size:1.3em}.rk{background:var(--y);color:#3a2a00;border-radius:10px;padding:0 10px;font-weight:900}
.crown{font-weight:900;color:var(--y);font-size:.95em}
table{width:100%;border-collapse:collapse;font-size:clamp(16px,2vw,28px)}th,td{padding:10px;border-bottom:1px solid #ffffff33;text-align:center}th{color:var(--y)}
.panel{background:#ffffff12;border-radius:18px;padding:14px}.panel summary{cursor:pointer;font-weight:800}
.tset{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tset input{font:inherit;font-weight:700;padding:8px 10px;border-radius:10px;border:2px solid #6f93ff;background:#0a1a55;color:#fff;width:150px}
.log{max-height:240px;overflow:auto;margin-top:10px;font-size:15px;display:grid;gap:4px}
.ov{position:fixed;inset:0;display:none;place-items:center;text-align:center;font-weight:900;z-index:9;pointer-events:none;background:#000b;font-size:clamp(50px,13vw,200px);color:var(--r);text-shadow:0 0 50px var(--r)}
.ov.show{display:grid;animation:ov 3s forwards}.ov.rv{color:var(--y);text-shadow:0 0 50px var(--y);font-size:clamp(36px,9vw,140px)}
@keyframes ov{0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(1.12)}22%{transform:scale(1)}85%{opacity:1}100%{opacity:0}}
.start{min-height:80vh;display:grid;place-content:center;gap:24px;text-align:center}.start button{font-size:clamp(24px,3vw,40px)}
@media(max-width:900px){.stage{grid-template-columns:1fr}.stage>.q:first-child{order:2}}
</style></head><body>
<div class="ov" id="ov"></div>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null,es=null,t0=0,code=localStorage.tcode||'',seen=new Set(),prev='',base=location.origin,lastTeams='',lastKey='';
const api=(p,b)=>fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
const act=(action,x)=>api('act',{code,action,...x});
async function newGame(){if(S&&!confirm('Tạo phòng mới? Phòng hiện tại sẽ bị bỏ.'))return;const r=await api('new',{});code=r.code;localStorage.tcode=code;seen.clear();connect()}
function connect(){if(es)es.close();es=new EventSource(`/api/events?code=${code}&role=t`);
  es.onmessage=e=>{S=JSON.parse(e.data);t0=performance.now();render()};
  es.onerror=()=>{if(es.readyState===2){S=null;code='';localStorage.removeItem('tcode');render()}}}
fetch('/api/info').then(r=>r.json()).then(i=>{if(/^(localhost|127\.)/.test(location.hostname)&&i.ips[0])base='http://'+i.ips[0]+':'+i.port;render()});
const cur=()=>Math.min(S.dur,S.status==='running'?S.elapsed+performance.now()-t0:S.elapsed);
function shell(){$('#app').innerHTML=`<h1>⚡ TĂNG TỐC – MẠCH ĐIỆN ĐƠN GIẢN ⚡</h1>
<div class="bar"><div class="code">Học sinh vào: <b>${esc(base.replace('http://',''))}/s</b> &nbsp; Mã phòng: <b>${S.code}</b></div><button class="yl" onclick="newGame()">NEW GAME</button></div>
<div class="stage"><div class="q"><h2>TỪ KHÓA CẦN TÌM LÀ GÌ?</h2><div class="hint">🔋 + 💡 + 🔌 = ?</div><div class="tiles" id="tiles"></div></div>
<div><div class="ring" id="ring"><div class="num" id="num">60</div></div></div>
<div class="q"><div class="ctl"><button class="go" id="bs" onclick="act('start')">▶ START</button><button id="bp" onclick="act('pause')">⏸ PAUSE</button><button class="bad" onclick="confirm('Reset trò chơi?')&&(seen.clear(),act('reset'))">↺ RESET</button><button class="yl" id="br" onclick="act('reveal')">⚡ SHOW ANSWER</button></div></div></div>
<div class="teams" id="teams"></div><div id="res"></div>
<details class="panel" id="setup"><summary>⚙️ Nhóm chơi (thêm / bớt / đổi tên)</summary><div class="tset" id="tset"></div></details>
<details class="panel"><summary>📜 Lịch sử trả lời</summary><div class="log" id="log"></div></details>`;lastKey='shell:'+S.code;lastTeams=''}
function render(){const a=$('#app');
  if(!S){a.innerHTML=`<div class="start"><h1>⚡ TĂNG TỐC – MẠCH ĐIỆN ĐƠN GIẢN ⚡</h1><button class="go" onclick="newGame()">🎮 NEW GAME</button>${localStorage.tcode?'':''}</div>`;lastKey='';return}
  if(lastKey!=='shell:'+S.code||!$('#ring'))shell();
  const ru=S.status==='running',idle=S.status==='idle';
  $('#bs').disabled=ru||S.status==='ended';$('#bs').textContent=S.status==='paused'?'▶ TIẾP TỤC':'▶ START';
  $('#bp').disabled=!ru;$('#br').disabled=S.revealed;
  const key=S.key||'';const L=[...'MẠCH ĐIỆN'];
  $('#tiles').innerHTML=L.map((c,i)=>c===' '?'<span class="sp"></span>':`<div class="tile ${key?'on':''}" style="animation-delay:${i*.12}s">${key?c:'?'}</div>`).join('');
  if(key&&prev!=='rv'){const o=$('#ov');o.className='ov show rv';o.innerHTML='⚡ MẠCH ĐIỆN ⚡';setTimeout(()=>o.className='ov',3100)}
  if(S.status==='ended'&&!S.revealed&&prev==='running'){const o=$('#ov');o.className='ov show';o.textContent="TIME'S UP!";setTimeout(()=>o.className='ov',3100)}
  prev=S.revealed?'rv':S.status;
  if(idle)seen.clear();
  const f=S.answers[0];
  $('#teams').innerHTML=S.teams.map(t=>{const i=S.answers.findIndex(x=>x.team===t.id),x=S.answers[i],n=x&&!seen.has(t.id);if(x)seen.add(t.id);
    return `<div class="card ${x?'done':''} ${i===0?'first':''} ${x&&S.revealed?(x.ok?'ok':'no'):''} ${n?'pop':''}"><div class="tn">${esc(t.name)}<i class="dot ${S.joined.includes(t.id)?'on':''}" title="Đã vào phòng"></i></div>
    <div class="st">${x?'✅ Đã trả lời':'⏳ Chưa trả lời'}</div><div class="ans">${x?esc(x.text):'—'}</div>
    <div class="meta">${x?`<b>${(x.t/1000).toFixed(1)}s</b><span class="rk">#${i+1}</span>${S.revealed?(x.ok?'✔️':'❌'):''}`:'&nbsp;'}</div>${i===0?'<div class="crown">🏆 NHANH NHẤT!</div>':''}</div>`}).join('');
  if(S.revealed){const rows=[...S.answers].sort((p,q)=>(q.ok-p.ok)||p.t-q.t),m=['🥇','🥈','🥉'];let r=0;
    $('#res').innerHTML=`<div class="panel"><h1 style="font-size:clamp(20px,2.6vw,36px);margin-bottom:8px">🏆 BẢNG KẾT QUẢ</h1><table><tr><th>Hạng</th><th>Nhóm</th><th>Đáp án</th><th>Thời gian</th></tr>${rows.map(x=>{const nm=S.teams.find(t=>t.id===x.team)?.name||'';return `<tr><td>${x.ok?(m[r]||'')+' '+(++r):'❌'}</td><td>${esc(nm)}</td><td>${esc(x.text)}</td><td>${(x.t/1000).toFixed(1)}s</td></tr>`}).join('')||'<tr><td colspan=4>Chưa có nhóm nào gửi đáp án</td></tr>'}</table></div>`}else $('#res').innerHTML='';
  const tk=JSON.stringify(S.teams)+idle;if(tk!==lastTeams){lastTeams=tk;const d=!idle?'disabled':'';
    $('#tset').innerHTML=S.teams.map((t,i)=>`<span><input ${d} value="${esc(t.name)}" onchange="saveTeams()"> <button ${d} class="bad" style="padding:.3em .6em" onclick="delTeam(${i})">✕</button></span>`).join('')+`<button ${d} class="go" onclick="addTeam()">＋ Thêm nhóm</button>`}
  $('#log').innerHTML=[...S.log].reverse().map(l=>`<div>${l.t==null?'':'['+(l.t/1000).toFixed(1)+'s] '}${esc(l.msg)}</div>`).join('')}
const names=()=>[...document.querySelectorAll('#tset input')].map(i=>i.value);
const saveTeams=()=>act('teams',{names:names()});
const addTeam=()=>{const n=names();n.push('NHÓM '+(n.length+1));act('teams',{names:n})};
const delTeam=i=>{const n=names();n.splice(i,1);if(n.length)act('teams',{names:n})};
(function tick(){if(S){const rem=S.dur-cur(),n=$('#num'),r=$('#ring');if(n){n.textContent=S.status==='idle'?S.dur/1000:Math.ceil(rem/1000);r.style.setProperty('--p',rem/S.dur*100);r.classList.toggle('low',S.status==='running'&&rem<=10000)}}requestAnimationFrame(tick)})();
if(code)connect();else render();
</script></body></html>
