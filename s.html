<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Tăng tốc – Học sinh</title><link rel="stylesheet" href="app.css">
<style>
main{max-width:720px;margin:auto;padding:18px;display:grid;gap:18px;text-align:center;min-height:100vh;align-content:center}
input{font:inherit;font-weight:800;font-size:30px;text-align:center;padding:18px;border-radius:18px;border:4px solid #6f93ff;background:#0a1a55;color:#fff;width:100%;text-transform:uppercase}
input:disabled{opacity:.6}input:focus{outline:none;border-color:var(--y)}
.big{font-size:30px;padding:.8em;width:100%}.pick{display:grid;grid-template-columns:1fr 1fr;gap:14px}.pick button{font-size:26px;padding:1.2em .4em}
.tname{font-size:clamp(28px,6vw,44px);font-weight:900;color:var(--y)}.msg{font-size:24px;font-weight:800;min-height:1.6em}.err{color:var(--r);font-weight:800}
.ring{width:min(48vw,230px)}.num{font-size:min(22vw,110px)}
</style></head><body><main id="app"></main>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S=null,es=null,t0=0,code=new URLSearchParams(location.search).get('c')||sessionStorage.c||'',team=sessionStorage.t||'',sent=false,view='',err='';
const api=(p,b)=>fetch('/api/'+p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}).then(r=>r.json());
function connect(){if(es)es.close();es=new EventSource(`/api/events?code=${code}&role=s&team=${team}`);
  es.onmessage=e=>{S=JSON.parse(e.data);t0=performance.now();sessionStorage.c=code;if(team&&!S.teams.some(t=>t.id===team)){team='';sessionStorage.t='';connect();return}render()};
  es.onerror=()=>{if(es.readyState===2){S=null;err='Không tìm thấy mã phòng!';sessionStorage.removeItem('c');render()}}}
function join(){code=$('#c').value.trim();if(code){err='';connect()}}
function pick(id){team=id;sessionStorage.t=id;connect()}
async function submit(){const v=$('#a').value.trim();if(!v)return;sent=true;$('#a').disabled=true;$('#sb').disabled=true;
  const r=await api('submit',{code,team,text:v});if(r.error){sent=false;err=r.error;}else err='';render()}
const cur=()=>Math.min(S.dur,S.status==='running'?S.elapsed+performance.now()-t0:S.elapsed);
function render(){const a=$('#app');
  if(!S){view='j';a.innerHTML=`<h1>⚡ TĂNG TỐC ⚡</h1><div class="msg">Nhập mã phòng</div><input id="c" inputmode="numeric" placeholder="Mã phòng" value="${esc(code)}"><button class="go big" onclick="join()">VÀO PHÒNG</button><div class="err">${esc(err)}</div>`;return}
  if(!team){view='p';a.innerHTML=`<h1>⚡ CHỌN NHÓM CỦA EM ⚡</h1><div class="pick">${S.teams.map(t=>`<button onclick="pick('${t.id}')">${esc(t.name)}</button>`).join('')}</div>`;return}
  const mine=S.answers.find(x=>x.team===team),ru=S.status==='running',tm=S.teams.find(t=>t.id===team);
  if(mine)sent=true;if(S.status==='idle'&&!mine)sent=false;
  if(view!=='g'){view='g';a.innerHTML=`<div class="tname" id="tn"></div><div class="ring" id="ring"><div class="num" id="num">60</div></div><input id="a" maxlength="60" autocomplete="off" autocapitalize="characters" placeholder="Nhập từ khóa của nhóm..."><button class="go big" id="sb" onclick="submit()">GỬI ĐÁP ÁN</button><div class="msg" id="m"></div><div class="err" id="e"></div>`}
  $('#tn').textContent='⚡ '+tm.name+' ⚡';
  const i=$('#a');if(mine)i.value=mine.text;i.disabled=!ru||sent;$('#sb').disabled=!ru||sent;
  let m='⏳ Chờ cô giáo bấm START...';
  if(ru&&!sent)m='💡 Nhập từ khóa và bấm GỬI!';
  if(sent)m=S.revealed?(mine?.ok?'🎉 Chính xác! Giỏi quá!':'Chưa đúng rồi. Cố lên lần sau!'):'✅ Đã gửi! Hãy chờ kết quả.';
  else if(S.status==='ended')m='⏰ TIME\'S UP! Hết giờ rồi.';
  if(S.revealed)m+=`  ⚡ ${S.key} ⚡`;
  $('#m').textContent=m;$('#e').textContent=err}
(function tick(){if(S&&$('#num')){const rem=S.dur-cur();$('#num').textContent=S.status==='idle'?S.dur/1000:Math.ceil(rem/1000);$('#ring').style.setProperty('--p',rem/S.dur*100);$('#ring').classList.toggle('low',S.status==='running'&&rem<=10000)}requestAnimationFrame(tick)})();
if(code)connect();else render();
</script></body></html>
